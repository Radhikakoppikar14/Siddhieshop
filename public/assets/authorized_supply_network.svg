<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" fill="none">
  <defs>
    <linearGradient id="background" x1="76" y1="36" x2="948" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFEFF"/>
      <stop offset="1" stop-color="#EAF2F4"/>
    </linearGradient>
    <linearGradient id="brandGlow" x1="450" y1="0" x2="575" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="0" width="1024" height="640" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity=".07"/>
    </filter>
    <style>
      .portfolio-label { font: 500 16px Arial, Helvetica, sans-serif; fill: #263546; }
      .brand { font-family: Arial, Helvetica, sans-serif; font-weight: 800; letter-spacing: -.7px; }
      .lane { fill: #FFFFFF; fill-opacity: .78; stroke-width: 4; }
    </style>
  </defs>

  <rect width="1024" height="640" rx="18" fill="url(#background)"/>

  <!-- Quiet technical linework in the background -->
  <g stroke="#B8C9CE" stroke-opacity=".22" stroke-width="1">
    <path d="M0 140 187 0M0 218 292 0M0 555 435 0M1024 116 850 0M1024 205 754 0M1024 622 440 38M1024 550 566 0"/>
    <path d="M0 470 333 640M0 574 128 640M1024 420 768 640M1024 518 872 640"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".6">
    <path d="m85 43 4 9 9 4-9 4-4 9-4-9-9-4 9-4 4-9ZM937 480l5 12 12 5-12 5-5 12-5-12-12-5 12-5 5-12Z"/>
  </g>

  <!-- Fine central glow behind the connected partner marks -->
  <rect x="424" y="40" width="176" height="510" fill="url(#brandGlow)"/>

  <!-- Product portfolio lanes -->
  <g filter="url(#softShadow)">
