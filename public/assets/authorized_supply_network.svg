    <rect class="lane" x="600" y="58" width="366" height="52" rx="10" stroke="#81518F"/>

    <rect class="lane" x="58" y="130" width="366" height="52" rx="10" stroke="#3B7380"/>
    <rect class="lane" x="58" y="202" width="366" height="52" rx="10" stroke="#36727C"/>
    <rect class="lane" x="600" y="202" width="366" height="52" rx="10" stroke="#559DB0"/>

    <rect class="lane" x="600" y="274" width="366" height="52" rx="10" stroke="#79AE78"/>

    <rect class="lane" x="58" y="346" width="366" height="52" rx="10" stroke="#B94D4B"/>
    <rect class="lane" x="600" y="346" width="366" height="52" rx="10" stroke="#BA5552"/>

    <rect class="lane" x="58" y="418" width="366" height="52" rx="10" stroke="#D5A944"/>
    <rect class="lane" x="600" y="418" width="366" height="52" rx="10" stroke="#D4B442"/>

    <rect class="lane" x="58" y="490" width="366" height="52" rx="10" stroke="#4B8992"/>
    <rect class="lane" x="600" y="490" width="366" height="52" rx="10" stroke="#4B8992"/>
  </g>

  <!-- Interlocking colored partner rings -->
  <g fill="none" stroke-width="9" opacity=".94">
    <ellipse cx="512" cy="105" rx="59" ry="36" stroke="#E16F3B"/>
    <ellipse cx="512" cy="146" rx="59" ry="36" stroke="#7F4D8B"/>
    <ellipse cx="512" cy="201" rx="59" ry="36" stroke="#2E7788"/>
    <ellipse cx="512" cy="273" rx="59" ry="36" stroke="#78A957"/>
    <ellipse cx="512" cy="345" rx="59" ry="36" stroke="#C13F48"/>
    <ellipse cx="512" cy="417" rx="59" ry="36" stroke="#85B949"/>
    <ellipse cx="512" cy="489" rx="59" ry="36" stroke="#317E8B"/>
