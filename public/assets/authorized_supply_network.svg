    <text x="512" y="157" class="brand" font-size="22" fill="#1473A5">EATON</text>
    <text x="512" y="210" class="brand" font-size="17" fill="#B92D36">HAVELLS</text>
    <text x="512" y="282" class="brand" font-size="17" fill="#B92D36">HAVELLS</text>
    <text x="512" y="354" class="brand" font-size="23" fill="#1686A5">hager</text>
    <text x="512" y="426" class="brand" font-size="16" fill="#253342">LUMINIS</text>
    <text x="512" y="498" class="brand" font-size="16" fill="#182333">MENNEKES</text>
  </g>

  <!-- Portfolio descriptions -->
  <g class="portfolio-label" text-anchor="middle">
    <text x="240" y="80"><tspan x="240">Comprehensive Range of Electrical</tspan><tspan x="240" dy="19">Cables &amp; Connectors</tspan></text>
    <text x="784" y="80"><tspan x="784">Medium Voltage Switchgear &amp;</tspan><tspan x="784" dy="19">Low Voltage Control Systems</tspan></text>

    <text x="240" y="152"><tspan x="240">Indoor LED Lighting</tspan><tspan x="240" dy="19">Luminaires &amp; Drivers</tspan></text>
    <text x="240" y="224"><tspan x="240">LV Switchboard Components</tspan><tspan x="240" dy="19">&amp; Enclosures</tspan></text>
    <text x="784" y="224"><tspan x="784">Explosion-proof Lighting Fixtures</tspan><tspan x="784" dy="19">&amp; Gear</tspan></text>

    <text x="784" y="296"><tspan x="784">Industrial Plugs, Sockets</tspan><tspan x="784" dy="19">&amp; Interlocks</tspan></text>

    <text x="240" y="368"><tspan x="240">Modular Wiring Systems &amp;</tspan><tspan x="240" dy="19">Cable Management</tspan></text>
    <text x="784" y="368"><tspan x="784">Industrial Wiring &amp;</tspan><tspan x="784" dy="19">Cable Distribution</tspan></text>

    <text x="240" y="440"><tspan x="240">Cable Glands, Ties</tspan><tspan x="240" dy="19">&amp; Accessories</tspan></text>
    <text x="784" y="440"><tspan x="784">Cable Management</tspan><tspan x="784" dy="19">Systems</tspan></text>

    <text x="240" y="512"><tspan x="240">Lightning Protection &amp;</tspan><tspan x="240" dy="19">Surge Arresters</tspan></text>
    <text x="784" y="512"><tspan x="784">Earthing &amp; Grounding</tspan><tspan x="784" dy="19">Equipment</tspan></text>
  </g>

  <text x="512" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1E293B">
    Authorized <tspan font-weight="700">Multi-Brand</tspan> Integrated Product Supply Network - Complete Portfolio
  </text>
